<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Медаль получена · 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#07080A;color:#ECEEF1;font-family:Inter,system-ui,-apple-system,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
#app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center}
#sky{position:absolute;inset:0;width:100%;height:100%}
.glow{position:absolute;left:50%;top:40%;width:560px;height:560px;margin:-280px 0 0 -280px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,122,56,.14),rgba(255,122,56,.04) 55%,transparent);opacity:0;transition:opacity 1.6s}
.on .glow{opacity:1}
#gl{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none;cursor:grab}
#gl:active{cursor:grabbing}
#fx{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:3}
#rays{display:none;position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;opacity:0;transition:opacity 1.4s}
.on #rays{opacity:1}
#rays i{position:absolute;top:-80px;height:78%;filter:blur(18px);transform-origin:top center;animation:rsw 7s ease-in-out infinite alternate}
@keyframes rsw{0%{opacity:.55;transform:rotate(var(--r))}100%{opacity:1;transform:rotate(calc(var(--r) + 3deg)) translateX(8px)}}
#spot{display:none;position:absolute;left:50%;top:-10%;width:760px;height:900px;margin-left:-380px;pointer-events:none;background:radial-gradient(50% 60% at 50% 0%,rgba(255,240,220,.10),transparent 75%);clip-path:polygon(38% 0,62% 0,100% 100%,0 100%);opacity:0;transition:opacity .4s}
.lnd #spot{opacity:1;animation:spf 1.8s ease-out}
@keyframes spf{0%{opacity:0}100%{opacity:1}}
.top{position:relative;z-index:2;margin-top:max(22px,env(safe-area-inset-top));font:500 11px/1 "JetBrains Mono",ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;color:#FF8A4A;opacity:0;transform:translateY(-6px);transition:all .6s .2s;text-shadow:0 1px 8px #000}
.on .top{opacity:1;transform:none}
.b{position:absolute;left:24px;right:24px;bottom:max(24px,calc(env(safe-area-inset-bottom) + 16px));z-index:2;text-align:center;max-width:420px;margin:0 auto}
.t{opacity:0;transform:translateY(12px);transition:opacity .7s,transform .9s cubic-bezier(.2,.8,.2,1)}
.lnd .t{opacity:1;transform:none}
.n{font-size:27px;line-height:31px;font-weight:500;letter-spacing:-.02em}
.d{font-size:14px;line-height:20px;color:rgba(236,238,241,.6);margin-top:8px}
.tier{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font:500 10.5px/1 "JetBrains Mono",ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;color:rgba(236,238,241,.55)}
.tier i{width:8px;height:8px;border-radius:50%}
.btn{margin-top:18px;width:100%;height:50px;border:0;border-radius:25px;background:#ECEEF1;color:#111;font:inherit;font-size:15px;font-weight:600;cursor:pointer;opacity:0;transform:translateY(12px);transition:opacity .7s .25s,transform .9s .25s cubic-bezier(.2,.8,.2,1)}
.lnd .btn{opacity:1;transform:none}
.hint{margin-top:10px;font-size:12px;color:rgba(236,238,241,.38);opacity:0;transition:opacity 1s 1.2s}.lnd .hint{opacity:1}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:12px -24px 0;padding:0 24px}.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;height:30px;padding:0 12px;border-radius:15px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:rgba(236,238,241,.75);font:inherit;font-size:12px;cursor:pointer}
.chips button.on{border-color:#FF8A4A;color:#fff;background:rgba(255,106,31,.14)}
#app.badge #mats{display:none!important}
#stb{position:absolute;left:0;top:0;width:100%;height:70%;display:none;align-items:center;justify-content:center;z-index:2;perspective:900px}
.stamp2d #stb{display:flex}#forms{display:none!important}.stamp #forms{display:none}.stamp #mats{display:none}#metals{display:none}.stamp #metals{display:flex}#vars{display:none}
.stw{position:relative;width:200px;height:250px;transform:scale(1.25)}
.stw .sb,.stw .pmk{position:absolute;inset:0}.stw .sb{filter:drop-shadow(0 18px 30px rgba(0,0,0,.6))}
.stw.go .sb{animation:sbIn 1s cubic-bezier(.2,1.1,.3,1) both}
@keyframes sbIn{0%{transform:translateY(-130%) rotate(-25deg) rotateY(60deg);opacity:0}60%{opacity:1}100%{transform:rotate(-3deg)}}
.stw .pmk{opacity:0}.stw.go .pmk{animation:pmIn .32s cubic-bezier(.3,1.6,.5,1) 1.15s both}
@keyframes pmIn{0%{transform:scale(2.4) rotate(-20deg);opacity:0}100%{transform:none;opacity:1}}
.stw.go{animation:shk .35s ease 1.42s}
@keyframes shk{0%,100%{transform:scale(1.25)}30%{transform:scale(1.21) translateY(4px)}60%{transform:scale(1.27)}}
#load{position:absolute;left:50%;top:35%;transform:translate(-50%,-50%);font-size:12px;color:rgba(236,238,241,.35)}

.emb #kinds,.emb #mats,.emb #forms,.emb #vars,.emb #metals,.emb #chips,.emb .hint{display:none!important}
</style>

<div class="glow"></div>

<div id="stb"><div class="stw" id="stw"></div></div>

<div class="b">
<div class="t"><div class="n" id="nm"></div><div class="d" id="cd"></div><div class="tier" id="tr"><i></i><span></span></div></div>
<button class="btn" id="go">Забрать в паспорт</button>

</div>

    if (window.parent !== window) window.parent.postMessage(msg, '*'); else location.href = '../?ex=' + encodeURIComponent(EX) + '&open=dossier'; return; }
  window.play(cur); };
</script>

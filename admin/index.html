<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Управление приложением · Музей космонавтики</title>
<link rel="icon" href="../app/g/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0B0D;--card:#14161A;--card2:#1B1E23;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);--tx:#fff;--mu:rgba(255,255,255,.56);--mu2:rgba(255,255,255,.38);--ac:#FF8A4A;--ac2:#FF6A1F;--err:#FF5C5C;--ok:#5CD39A;--f:'Inter',system-ui,-apple-system,sans-serif;--m:'JetBrains Mono',ui-monospace,Menlo,monospace}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font:14px/1.45 var(--f);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.mono{font-family:var(--m);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.hide{display:none!important}

/* вход */
#login{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(80% 60% at 50% 0%,rgba(255,106,31,.16),transparent 70%),var(--bg);z-index:50}
.lg{width:380px;padding:34px 32px 28px;border-radius:28px;background:var(--card);border:1px solid var(--line)}
.lg .logo{margin-bottom:26px}
.lg h1{margin:0 0 6px;font-size:26px;font-weight:600;letter-spacing:-.01em}
.lg p{margin:0 0 22px;color:var(--mu)}
.lg label{display:block;margin-bottom:14px}
.lg .err{color:var(--err);font-size:13px;min-height:18px;margin:-4px 0 10px}
.lg .btn{width:100%;height:46px}

/* логотип */
.logo{display:flex;align-items:center;gap:12px}
.logo img{width:38px;height:38px;border-radius:11px}
.logo b{display:block;font-weight:600;font-size:14px;line-height:1.2}
.logo span{display:block;color:var(--mu);font-size:12px}

/* раскладка */
#app{display:grid;grid-template-columns:232px minmax(420px,1fr) 440px;height:100vh}
aside.nav{border-right:1px solid var(--line);padding:18px 14px 14px;display:flex;flex-direction:column;gap:14px;overflow:auto}
.nav nav{display:flex;flex-direction:column;gap:2px}
.nav nav button{display:flex;align-items:center;gap:11px;height:36px;padding:0 12px;border:0;border-radius:12px;background:none;color:var(--mu);text-align:left;font-weight:500}
.nav nav button svg{width:18px;height:18px;flex:none}
.nav nav button:hover{background:var(--card);color:var(--tx)}
.nav nav button.on{background:var(--card2);color:var(--tx)}
.nav nav button.on svg{color:var(--ac)}
.nav nav button em{margin-left:auto;font-style:normal;font-family:var(--m);font-size:11px;color:var(--mu2)}
.nav nav button i{margin-left:auto;width:7px;height:7px;border-radius:50%;background:var(--err)}
.nav .foot{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.nav .foot button{border:0;background:none;color:var(--mu);text-align:left;padding:6px 12px;border-radius:10px}
.nav .foot button:hover{color:var(--tx);background:var(--card)}
.who{padding:10px 12px;border-radius:12px;background:var(--card);color:var(--mu);font-size:12.5px}
.who b{color:var(--tx);font-weight:500}

main{display:flex;flex-direction:column;min-width:0;height:100vh}
.top{display:flex;align-items:center;gap:12px;padding:16px 28px;border-bottom:1px solid var(--line)}
.status{display:flex;align-items:center;gap:8px;color:var(--mu);font-size:13px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--mu2)}
.status.draft i{background:var(--ac)}.status.pub i{background:var(--ok)}
.top .sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--line2);background:var(--card);font-weight:500;white-space:nowrap}
.btn:hover{border-color:rgba(255,255,255,.28)}
.btn.pri{background:var(--ac2);border-color:var(--ac2);color:#fff}
.btn.pri:hover{background:#ff7a33}
.btn.ghost{background:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.scroll{flex:1;overflow:auto;padding:26px 28px 80px}
.sh{display:flex;align-items:flex-end;gap:16px;margin-bottom:20px}
.sh h2{margin:4px 0 4px;font-size:28px;font-weight:600;letter-spacing:-.015em}
.sh p{margin:0;color:var(--mu);max-width:560px}
.sh .sp{flex:1}
.sh .mono{color:var(--ac)}

/* формы */
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 20px;margin-bottom:12px}
.fld{display:block;margin-bottom:16px}.fld:last-child{margin-bottom:0}
.fld>.l{display:flex;gap:8px;align-items:baseline;margin-bottom:7px;font-weight:500}
.fld>.l small{color:var(--mu2);font-weight:400;font-size:12.5px}
.fld .h{margin-top:6px;color:var(--mu2);font-size:12.5px}
.fld .e{margin-top:6px;color:var(--err);font-size:12.5px}
input[type=text],input[type=url],input[type=password],input:not([type]),textarea,select{width:100%;height:42px;padding:0 13px;border-radius:12px;border:1px solid var(--line2);background:#0E1013;outline:none;transition:border-color .15s}
textarea{height:auto;min-height:76px;padding:10px 13px;resize:vertical;line-height:1.45}
input:focus,textarea:focus,select:focus{border-color:var(--ac)}
.bad input,.bad textarea{border-color:var(--err)!important}
.row{display:grid;gap:12px}.row.c2{grid-template-columns:1fr 1fr}.row.c3{grid-template-columns:1fr 1fr 1fr}.row.c4{grid-template-columns:110px 1fr 1fr 110px}
.tg{display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none}
.tg input{display:none}
.tg .sw{width:42px;height:24px;border-radius:99px;background:#2a2e35;position:relative;transition:.2s;flex:none}
.tg .sw:after{content:'';position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.tg input:checked+.sw{background:var(--ac2)}.tg input:checked+.sw:after{left:21px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{height:34px;min-width:46px;padding:0 12px;border-radius:10px;border:1px solid var(--line2);background:#0E1013;color:var(--mu)}
.chips button.on{background:rgba(255,138,74,.14);border-color:var(--ac);color:var(--tx)}

/* списки */
.li{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:8px;transition:border-color .15s,opacity .15s}
.li.open{border-color:var(--line2)}
.li.bad{border-color:rgba(255,92,92,.5)}
.li.drag{opacity:.4}
.li.over-t{box-shadow:0 -2px 0 var(--ac)}.li.over-b{box-shadow:0 2px 0 var(--ac)}
.lh{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 8px;cursor:pointer}
.grip{width:26px;height:30px;display:grid;place-items:center;color:var(--mu2);cursor:grab;flex:none;border-radius:8px}
.grip:hover{color:var(--tx);background:var(--card2)}
.lh .tm{flex:none;min-width:62px;font-family:var(--m);font-size:12.5px;color:var(--ac)}
.lh .tt{flex:1;min-width:0}
.lh .tt b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lh .tt span{display:block;color:var(--mu);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lh .pr{flex:none;font-weight:600}
.ib{width:32px;height:32px;display:grid;place-items:center;border:0;border-radius:10px;background:none;color:var(--mu);flex:none}
.ib:hover{background:var(--card2);color:var(--tx)}
.ib.del:hover{color:var(--err)}
.ib svg{width:16px;height:16px}
.chev{transition:transform .2s}.li.open .chev{transform:rotate(180deg)}
.lb{padding:4px 20px 18px 46px;display:none}.li.open .lb{display:block}
.add{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:48px;border-radius:16px;border:1px dashed var(--line2);background:none;color:var(--mu);font-weight:500}
.add:hover{border-color:var(--ac);color:var(--tx)}.add svg{width:18px;height:18px}
.ltools{display:flex;gap:8px;margin-bottom:12px}
.ltools .sp{flex:1}
.empty{padding:26px;text-align:center;color:var(--mu);border:1px dashed var(--line2);border-radius:18px;margin-bottom:8px}

/* превью */
.pv{border-left:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:16px 20px;background:radial-gradient(70% 50% at 50% 40%,rgba(255,106,31,.07),transparent 70%);min-height:0;position:relative}
.pvt{display:flex;align-items:center;gap:8px;width:100%;margin-bottom:12px}
.pvt .mono{color:var(--mu)}
.pvt .sp{flex:1}
.pvt .live{display:flex;align-items:center;gap:6px;color:var(--ok);font-family:var(--m);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.pvt .live i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px rgba(92,211,154,.15)}
.phwrap{flex:1;min-height:0;width:100%;display:flex;align-items:flex-start;justify-content:center}
.phone{width:390px;height:844px;border-radius:54px;padding:12px;background:#1c1f24;box-shadow:0 0 0 1px rgba(255,255,255,.12),0 30px 80px rgba(0,0,0,.55);transform-origin:top center;flex:none}
.phone iframe{width:100%;height:100%;border:0;border-radius:42px;background:#0A0B0D;display:block}
.qrpop{position:absolute;top:56px;right:20px;width:280px;padding:18px;border-radius:20px;background:var(--card2);border:1px solid var(--line2);box-shadow:0 20px 60px rgba(0,0,0,.5);z-index:5}
.qrpop img{display:block;width:100%;border-radius:12px;background:#fff}
.qrpop b{display:block;margin:12px 0 4px}
.qrpop p{margin:0;color:var(--mu);font-size:12.5px}
.qrpop a{color:var(--ac);word-break:break-all}

/* журнал */
.log{display:flex;flex-direction:column}
.log .r{display:grid;grid-template-columns:120px 130px 1fr;gap:14px;padding:12px 4px;border-top:1px solid var(--line)}
.log .r:first-child{border-top:0}
.log .r span{color:var(--mu);font-size:12.5px}
.log .r .mono{color:var(--mu2);text-transform:none;letter-spacing:0}

/* окна и тосты */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:40;backdrop-filter:blur(4px)}
.md{width:520px;max-width:calc(100vw - 32px);padding:26px 26px 22px;border-radius:24px;background:var(--card);border:1px solid var(--line2)}
.md h3{margin:0 0 6px;font-size:21px;font-weight:600}
.md p{margin:0 0 16px;color:var(--mu)}
.md .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.md ol{margin:0 0 16px;padding-left:20px;color:var(--mu)}.md ol li{margin-bottom:4px}
.md a{color:var(--ac)}
.md .res{padding:12px 14px;border-radius:12px;margin-top:12px;font-size:13.5px}
.md .res.ok{background:rgba(92,211,154,.1);color:var(--ok)}
.md .res.no{background:rgba(255,92,92,.1);color:var(--err)}
#toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:60;align-items:center}
.toast{display:flex;align-items:center;gap:14px;padding:11px 12px 11px 18px;border-radius:14px;background:#24272d;border:1px solid var(--line2);box-shadow:0 14px 40px rgba(0,0,0,.5);animation:tin .2s ease}
.toast button{border:0;background:none;color:var(--ac);font-weight:600;padding:4px 8px;border-radius:8px}
.toast button:hover{background:rgba(255,138,74,.12)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
/* группы навигации и карточка пользователя */
.nav .grp{margin:14px 12px 6px;color:var(--mu2)}.nav .grp:first-child{margin-top:0}
.ucard{display:flex;align-items:center;gap:10px;padding:10px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.ucard .av{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--ac),var(--ac2));font-weight:600;color:#fff;flex:none}
.ucard b{display:block;font-weight:500;font-size:13.5px;line-height:1.2}.ucard span{display:block;color:var(--mu);font-size:12px}
.ucard .ib{margin-left:auto}
/* сводка */
.dhero{position:relative;overflow:hidden;padding:26px 28px;border-radius:24px;margin-bottom:14px;background:radial-gradient(90% 140% at 100% 0%,rgba(255,106,31,.35),transparent 60%),linear-gradient(135deg,#1d1410,#14161A 60%);border:1px solid rgba(255,138,74,.25)}
.dhero h2{margin:6px 0 6px;font-size:30px;font-weight:600;letter-spacing:-.02em}.dhero p{margin:0;color:var(--mu);max-width:520px}
.dhero .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.kpi{padding:16px 18px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.kpi .mono{color:var(--mu)}.kpi b{display:block;margin:8px 0 2px;font-size:28px;font-weight:600;letter-spacing:-.02em}
.kpi span{font-size:12.5px;color:var(--mu)}.kpi span em{font-style:normal;color:var(--ok)}.kpi span em.dn{color:var(--err)}
.grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:10px;margin-bottom:10px}
.panel{padding:18px 20px;border-radius:20px;background:var(--card);border:1px solid var(--line);min-width:0}
.panel h3{margin:0 0 2px;font-size:16px;font-weight:600}.panel .sub{color:var(--mu);font-size:12.5px;margin-bottom:14px}
.panel .ph{display:flex;align-items:flex-start;gap:10px}.panel .ph .sp{flex:1}
.bars{display:flex;align-items:flex-end;gap:10px;height:170px;padding-top:22px;border-bottom:1px solid var(--line2);position:relative}
.bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;position:relative;cursor:default}
.bars .b i{display:block;width:100%;max-width:44px;border-radius:6px 6px 0 0;background:rgba(255,138,74,.45);transition:background .15s}
.bars .b.cur i{background:var(--ac)}.bars .b:hover i{background:#FFB27A}
.bars .b em{position:absolute;bottom:calc(var(--h) + 6px);font-style:normal;font-size:11.5px;color:var(--mu);white-space:nowrap}
.bars .b.cur em,.bars .b:hover em{color:var(--tx)}
.bx{display:flex;gap:10px;margin-top:8px}.bx span{flex:1;text-align:center;color:var(--mu2);font-size:11.5px;font-family:var(--m)}
.hb{display:grid;grid-template-columns:1fr;gap:9px}
.hb .r{display:grid;grid-template-columns:150px 1fr 56px;gap:10px;align-items:center;font-size:13px}
.hb .r span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mu)}
.hb .r .tr{height:10px;border-radius:5px;background:rgba(255,255,255,.05);overflow:hidden}.hb .r .tr i{display:block;height:100%;border-radius:5px;background:var(--ac)}
.hb .r b{text-align:right;font-weight:500;font-variant-numeric:tabular-nums}
.fun .r{display:grid;grid-template-columns:1fr auto;gap:4px 10px;margin-bottom:12px;font-size:13px}.fun .r span{color:var(--mu)}
.fun .r .tr{grid-column:1/-1;height:26px;border-radius:8px;background:rgba(255,255,255,.04);overflow:hidden}.fun .r .tr i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--ac2),var(--ac))}
.mini{display:flex;flex-direction:column}.mini .r{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}.mini .r:first-child{border-top:0}
.mini .r .w{flex:none;width:64px;font-family:var(--m);font-size:11.5px;color:var(--ac)}.mini .r b{display:block;font-weight:500;font-size:13.5px}.mini .r span{color:var(--mu);font-size:12px}
.mini .r:hover b{color:var(--ac)}
.demo{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:12px;background:rgba(255,255,255,.04);color:var(--mu);font-size:12.5px;margin-bottom:14px}
.demo i{width:6px;height:6px;border-radius:50%;background:var(--mu2);flex:none}
/* календарь */
.seg{display:inline-flex;padding:3px;border-radius:12px;background:#0E1013;border:1px solid var(--line2)}
.seg button{height:32px;padding:0 14px;border:0;border-radius:9px;background:none;color:var(--mu);font-weight:500}.seg button.on{background:var(--card2);color:var(--tx)}
.cal{border-radius:20px;background:var(--card);border:1px solid var(--line);overflow:hidden;margin-bottom:12px}
.cal .ch{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}.cal .ch b{font-size:16px;font-weight:600;text-transform:capitalize}.cal .ch .sp{flex:1}
.cal .wd{display:grid;grid-template-columns:repeat(7,1fr)}.cal .wd span{padding:8px 10px;color:var(--mu2);font-family:var(--m);font-size:11px;text-transform:uppercase}
.cal .gd{display:grid;grid-template-columns:repeat(7,1fr)}
.cal .d{min-height:96px;padding:6px 6px 8px;border-top:1px solid var(--line);border-left:1px solid var(--line);position:relative;cursor:pointer}
.cal .d:nth-child(7n+1){border-left:0}.cal .d.out{opacity:.35}.cal .d:hover{background:rgba(255,255,255,.02)}
.cal .d .n{font-size:12.5px;color:var(--mu);padding:2px 4px}.cal .d.today .n{display:inline-block;background:var(--ac2);color:#fff;border-radius:7px}
.cal .d .plus{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:7px;border:0;background:var(--card2);color:var(--mu);display:none;place-items:center}.cal .d:hover .plus{display:grid}
.cal .ev{display:block;width:100%;margin-top:4px;padding:3px 6px;border-radius:6px;border:0;background:rgba(255,138,74,.16);color:#fff;font-size:11.5px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .ev.long{background:rgba(156,196,234,.14)}.cal .ev:hover{background:rgba(255,138,74,.32)}
.cal .ev i{font-style:normal;font-family:var(--m);color:var(--ac);margin-right:4px}
/* экспонаты */
.srch{position:relative;flex:1;max-width:360px}.srch input{padding-left:38px}.srch svg{position:absolute;left:12px;top:12px;width:18px;height:18px;color:var(--mu2)}
.exth{width:44px;height:44px;border-radius:10px;background:#0E1013 center/cover no-repeat;flex:none;border:1px solid var(--line)}
.tag{display:inline-block;padding:2px 8px;border-radius:7px;background:rgba(255,138,74,.16);color:var(--ac);font-size:11px;font-weight:500;margin-left:6px;vertical-align:1px}
.lh .tt .tag{display:inline-block}.tag.mute{background:rgba(255,255,255,.07);color:var(--mu)}
.st{font-family:var(--m);font-size:11px;padding:3px 8px;border-radius:7px;flex:none}.st.plan{background:rgba(156,196,234,.14);color:#9CC4EA}.st.live{background:rgba(92,211,154,.14);color:var(--ok)}.st.past{background:rgba(255,255,255,.06);color:var(--mu2)}
input[type=date],input[type=datetime-local]{width:100%;height:42px;padding:0 13px;border-radius:12px;border:1px solid var(--line2);background:#0E1013;outline:none;color-scheme:dark}
@media (max-width:1240px){#app{grid-template-columns:200px minmax(380px,1fr) 380px}}
</style>
</head>
<body>

<div id="login">
  <form class="lg" id="lgForm" autocomplete="off">
    <div class="logo"><img src="../app/g/icon-192.png" alt=""><div><b>Музей космонавтики</b><span>управление приложением</span></div></div>
    <h1>Вход</h1>
    <p>Админ-панель приложения «Музей в кармане»</p>
    <label class="fld"><div class="l">Как вас зовут</div><input id="lgName" placeholder="Например, Анна Петрова" maxlength="60"></label>
    <label class="fld"><div class="l">Пароль</div><input id="lgPass" type="password" placeholder="••••••••"></label>
    <div class="err" id="lgErr"></div>
    <button class="btn pri" type="submit">Войти</button>
  </form>
</div>

<div id="app" class="hide">
  <aside class="nav">
    <div class="logo"><img src="../app/g/icon-192.png" alt=""><div><b>Музей космонавтики</b><span>управление приложением</span></div></div>
    <nav id="nav"></nav>
    <div class="foot">
      <button id="bLog">Журнал изменений</button>
      <button id="bDl">Скачать content.json</button>
      <button id="bReset">Сбросить черновик</button>

  f.querySelectorAll('.mini .w').forEach(w => w.style.whiteSpace = 'pre-line'); }
function upcoming(n){ const t = ymd(new Date()); return (draft.events || []).filter(o => o.day && (o.until || o.day) >= t).sort((a, b) => (a.day + (a.time || '')).localeCompare(b.day + (b.time || ''))).slice(0, n); }
function openItem(id, o){ const s = SEC[id]; if (id === 'events') { evView = 'list'; LS.set('kosmoEvView', 'list'); } const i = draft[KEY(s)].indexOf(o); clearOpen(id); if (i >= 0) open[id + ':' + i] = true; go(id);
  setTimeout(() => { const el = document.querySelector(`.li[data-i="${i}"]`); el && el.scrollIntoView({ block:'center', behavior:'smooth' }); }, 40); }

/* ---------- календарь мероприятий */
let calM = null;
function renderCal(s, f){ const now = new Date(); if (!calM) calM = new Date(now.getFullYear(), now.getMonth(), 1);
  const tools = h('div', { class:'ltools' }, h('div', { class:'sp' })); const ab = h('button', { class:'btn pri', type:'button', html:ico('plus') + '<span>Создать мероприятие</span>', onclick:() => addOn(ymd(new Date())) }); tools.append(ab); f.append(tools);
  const cal = h('div', { class:'cal' });
  const ch = h('div', { class:'ch' }, h('button', { class:'ib', type:'button', html:ico('left'), title:'Предыдущий месяц', onclick:() => { calM = new Date(calM.getFullYear(), calM.getMonth() - 1, 1); render(); } }),
    h('b', {}, calM.toLocaleDateString('ru-RU', { month:'long', year:'numeric' })),
    h('button', { class:'ib', type:'button', html:ico('right'), title:'Следующий месяц', onclick:() => { calM = new Date(calM.getFullYear(), calM.getMonth() + 1, 1); render(); } }), h('div', { class:'sp' }),
    h('button', { class:'btn ghost', type:'button', onclick:() => { calM = new Date(now.getFullYear(), now.getMonth(), 1); render(); } }, 'Сегодня'));
  cal.append(ch); const wd = h('div', { class:'wd' }); ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'].forEach(x => wd.append(h('span', {}, x))); cal.append(wd);
  const gd = h('div', { class:'gd' }); const start = new Date(calM); start.setDate(1 - ((calM.getDay() + 6) % 7)); const today = ymd(now), arr = draft.events || [];
  for (let k = 0; k < 42; k++){ const d = new Date(start); d.setDate(start.getDate() + k); if (k === 35 && d.getMonth() !== calM.getMonth()) break; const ds = ymd(d);
    const cell = h('div', { class:'d' + (d.getMonth() !== calM.getMonth() ? ' out' : '') + (ds === today ? ' today' : ''), title:'Нажмите, чтобы создать мероприятие на этот день', onclick:e => { if (e.target === cell || e.target.classList.contains('n')) addOn(ds); } }, h('span', { class:'n' }, String(d.getDate())));
    cell.append(h('button', { class:'plus', type:'button', html:ico('plus'), title:'Создать мероприятие', onclick:e => { e.stopPropagation(); addOn(ds); } }));
    arr.filter(o => o.day === ds || (o.until && o.day < ds && o.until >= ds && d.getDay() === 1)).sort((a, b) => (a.time || '').localeCompare(b.time || ''))
      .forEach(o => { const b = h('button', { class:'ev' + (o.until ? ' long' : ''), type:'button', title:`${o.title}${o.place ? ' · ' + o.place : ''}`, onclick:e => { e.stopPropagation(); openItem('events', o); }, html:(o.time ? `<i>${o.time}</i>` : '') + '<span></span>' }); b.querySelector('span').textContent = o.title || 'Без названия'; cell.append(b); });
    gd.append(cell); }
  cal.append(gd); f.append(cal);
  f.append(h('div', { class:'demo' }, h('i'), 'Нажмите на день, чтобы создать мероприятие. Выставки (голубые) повторяются по понедельникам, пока идут.')); }
function addOn(ds){ evView = 'list'; LS.set('kosmoEvView', 'list'); const s = SEC.events, arr = draft.events; const o = s.blank(); o.day = ds; arr.unshift(o); clearOpen('events'); open['events:0'] = true; touch('events', 'Мероприятия · создано'); go('events');
  setTimeout(() => { const q = document.querySelector('.li[data-i="0"] input:not([type=date])'); q && q.focus(); }, 60); }

/* ---------- экспонаты */
let EXB = [], exQ = '';
async function loadEx(){ if (EXB.length) return; try { const r = await fetch('../source/app/src/data.json', { cache:'no-store' }); if (r.ok) EXB = await r.json(); } catch(_){} }
const exOv = id => (draft.exhibits || []).find(x => x.id === id);
function renderEx(f){ const s = SEC.exhibits; draft.exhibits = draft.exhibits || [];
  f.append(h('div', { class:'sh' }, h('div', {}, h('div', { class:'mono' }, `${EXB.length} карточек · изменено ${draft.exhibits.length}`), h('h2', {}, s.name), h('p', {}, s.desc))));
  if (!EXB.length){ f.append(h('div', { class:'empty' }, 'Загружаю карточки…')); loadEx().then(() => cur === 'exhibits' && render()); return; }
  const srch = h('div', { class:'srch', html:ico('search') }); const q = h('input', { placeholder:'Поиск: «Восток», «скафандр», номер…' }); q.value = exQ; srch.append(q);
  q.addEventListener('input', () => { exQ = q.value; paintList(); });
  f.append(h('div', { class:'ltools' }, srch, h('div', { class:'sp' })));
  const box = h('div'); f.append(box);
  const paintList = () => { box.innerHTML = ''; const qq = exQ.trim().toLowerCase();
    EXB.filter(e => { const o = exOv(e.id) || {}; return !qq || [e.id, e.short, e.title, o.title, o.short].join(' ').toLowerCase().includes(qq); }).forEach(e => box.append(exItem(e))); 
    if (!box.children.length) box.append(h('div', { class:'empty' }, 'Ничего не нашлось')); };
  paintList(); }
function exItem(e){ const key = 'exhibits:' + e.id, isOpen = !!open[key];
  const val = k => { const o = exOv(e.id); if (o && o[k] != null) return o[k]; return k === 'dog' ? (e.dog && e.dog.text) || '' : e[k] || ''; };
  const el = h('div', { class:'li' + (isOpen ? ' open' : '') });
  const tt = h('div', { class:'tt' }, h('b', {}, val('title')), h('span', {}, `№ ${e.id} · инв. ${e.inv || '—'}`));
  const mark = h('span', { class:'tag' + (exOv(e.id) ? '' : ' hide') }, 'изменено'); tt.querySelector('b').append(mark);
  const head = h('div', { class:'lh' }, h('div', { class:'exth', style:e.photos && e.photos[0] ? `background-image:url('../app/${e.photos[0]}')` : '' }), tt,
    h('button', { class:'ib', type:'button', title:'Открыть в превью', html:ico('eye'), onclick:ev => { ev.stopPropagation(); lastSection = 'exhibits'; send({ ex:e.id }); } }),
    h('button', { class:'ib', type:'button', html:`<span class="chev" style="display:grid">${ico('chev')}</span>` }));
  head.addEventListener('click', () => { open[key] = !open[key]; el.classList.toggle('open', open[key]); if (open[key]){ lastSection = 'exhibits'; send({ ex:e.id }); } });
  const body = h('div', { class:'lb', style:'padding-left:20px' });
  const ensure = () => { let o = exOv(e.id); if (!o){ o = { id:e.id, title:e.title, short:e.short, desc:e.desc || '', dog:(e.dog && e.dog.text) || '' }; draft.exhibits.push(o); } return o; };
  const proxy = { title:val('title'), short:val('short'), desc:val('desc'), dog:val('dog') };
  const F = [ { row:'c2', items:[ { k:'title', l:'Название', v:V.req, max:90 }, { k:'short', l:'Короткое имя', v:V.req, max:40, hint:'На карте и в списках' } ] },
    { k:'desc', l:'Описание', t:'area', max:400, rows:3 }, { k:'dog', l:'Рассказ Белки', t:'area', max:600, rows:4, hint:'Белка читает его у экспоната в экскурсии.' } ];
  fields(F, proxy, 'exhibits', () => { const o = ensure(); Object.assign(o, proxy); tt.querySelector('b').firstChild.textContent = proxy.title; mark.classList.remove('hide'); sendExtra = { ex:e.id }; }).forEach(x => body.append(x));
  const rb = h('button', { class:'btn ghost', type:'button', style:'margin-top:12px', onclick:() => { draft.exhibits = draft.exhibits.filter(x => x.id !== e.id); touch('exhibits', `Экспонаты · ${e.title} · возвращён исходный текст`); sendExtra = { ex:e.id }; render(); } }, 'Вернуть исходный текст');
  if (exOv(e.id)) body.append(rb);
  el.append(head, body); return el; }

/* ---------- тосты */
function toast(text, act, fn, ms){ const t = h('div', { class:'toast' }, h('span', {}, text)); let done = false;
  if (act){ t.append(h('button', { type:'button', onclick:() => { if (done) return; done = true; fn(); t.remove(); } }, act)); }
  $('#toasts').append(t); setTimeout(() => t.remove(), ms || 3200); }

/* ---------- окна */
function modal(build){ const ov = h('div', { class:'ov' }); const md = h('div', { class:'md' }); ov.append(md); const close = () => ov.remove();
  ov.addEventListener('mousedown', e => { if (e.target === ov) close(); }); document.body.append(ov); build(md, close); return close; }

function showLog(){ modal((md, close) => { const L = LS.get('kosmoLog', []);
  md.style.width = '680px';
  md.append(h('h3', {}, 'Журнал изменений'), h('p', {}, 'Последние 20 правок в этом браузере. В боевой версии журнал общий и хранится на сервере.'));
  const box = h('div', { class:'log' });
  if (!L.length) box.append(h('div', { class:'empty' }, 'Правок пока нет'));
  L.forEach(r => box.append(h('div', { class:'r' }, h('span', { class:'mono' }, fmtT(r.at)), h('b', {}, r.who || '—'), h('div', {}, r.what))));
  md.append(box, h('div', { class:'acts' }, h('button', { class:'btn', type:'button', onclick:close }, 'Закрыть'))); }); }

function publish(){ const e = allErrors();
  if (e){ toast(`Исправьте ошибки перед публикацией: ${e}`); const s = S.find(x => errorsOf(x.id)); s && go(s.id); return; }
  modal((md, close) => {
    md.append(h('h3', {}, 'Опубликовать изменения'), h('p', {}, 'Приложение у всех посетителей обновится после перезагрузки — примерно через минуту.'));
    const tok = h('input', { type:'password', placeholder:'github_pat_…', autocomplete:'off', spellcheck:'false' }); tok.value = LS.get('kosmoGhToken', '') || '';
    const rem = h('input', { type:'checkbox', checked:!!LS.get('kosmoGhToken', '') });
    const res = h('div', { class:'res hide' });
    md.append(h('label', { class:'fld' }, h('div', { class:'l' }, 'Ключ доступа GitHub'), tok, h('div', { class:'h', html:'Fine-grained токен с правом <b>Contents: Read and write</b> только на репозиторий kosmo-museum.github.io. Ключ хранится лишь в этом браузере и уходит только на api.github.com. <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">Создать ключ →</a>' })));
    md.append(h('label', { class:'tg', style:'margin-top:4px' }, rem, h('span', { class:'sw' }), h('span', {}, 'Запомнить в этом браузере')));
    md.append(res);
    const go = h('button', { class:'btn pri', type:'button' }, 'Опубликовать');
    md.append(h('div', { class:'acts' }, h('button', { class:'btn ghost', type:'button', onclick:close }, 'Отмена'), go));
    go.onclick = async () => { const t = tok.value.trim(); if (!t){ tok.focus(); return; }
      rem.checked ? LS.set('kosmoGhToken', t) : LS.del('kosmoGhToken');
      go.disabled = true; go.textContent = 'Публикую…'; res.className = 'res hide';
      try { const out = clone(draft); out.updated = new Date().toISOString().slice(0, 10);
        const api = `https://api.github.com/repos/${REPO}/contents/${PATH}`;
        const H = { Authorization:'Bearer ' + t, Accept:'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28' };
        const g = await fetch(api + '?ref=' + BRANCH + '&t=' + Date.now(), { headers:H, cache:'no-store' });
        if (g.status === 401) throw new Error('Ключ не подошёл (401). Проверьте, что он скопирован целиком и не истёк.');
        if (g.status === 403 || g.status === 404) throw new Error(`Нет доступа к репозиторию (${g.status}). Ключу нужно право Contents: Read and write на kosmo-museum.github.io.`);
        if (!g.ok) throw new Error('GitHub ответил ' + g.status);
        const gj = await g.json(), sha = gj.sha; let rv = 0; try { rv = +JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(gj.content.replace(/\s/g, '')), c => c.charCodeAt(0)))).version || 0; } catch(_){}
        out.version = Math.max(rv, +published.version || 0) + 1;
        const body = JSON.stringify(out, null, 1) + '\n';
        const b64 = btoa(Array.from(new TextEncoder().encode(body), c => String.fromCharCode(c)).join(''));
        const msg = `Контент приложения: правки из админки (${user || 'без имени'})`;
        const p = await fetch(api, { method:'PUT', headers:{ ...H, 'Content-Type':'application/json' }, body:JSON.stringify({ message:msg, content:b64, sha, branch:BRANCH }) });
        if (p.status === 409) throw new Error('Кто-то опубликовал раньше вас. Нажмите «Опубликовать» ещё раз.');
        if (!p.ok) throw new Error('GitHub не принял файл: ' + p.status + ' ' + ((await p.json().catch(() => ({}))).message || ''));
        published = out; draft = clone(out); LS.set('kosmoDraft', draft); LS.set('kosmoPublished', out); save(); render(); updNav();
        logAdd(`Опубликована версия ${out.version}`);
        res.className = 'res ok'; res.innerHTML = '<b>Опубликовано.</b> <span id="pubLive">Доставляю на телефоны…</span>';
        const t0 = Date.now(), ver = out.version; let n = 0;
        const chk = async () => { const el = document.getElementById('pubLive'); if (!el) return; n++;
          try { const r = await fetch(`https://raw.githubusercontent.com/${REPO}/${BRANCH}/${PATH}?t=${Date.now()}`, { cache:'no-store' }); const d = await r.json();
            if ((+d.version || 0) >= ver){ el.textContent = `Изменения уже на телефонах: открытые приложения обновятся сами за ~5 с (${Math.round((Date.now() - t0) / 1000)} с с момента публикации).`; return; } } catch(_){}
          if (n > 30){ el.textContent = 'Телефоны получат изменения в течение минуты; если приложение было закрыто — при следующем открытии.'; return; }
          setTimeout(chk, 2000); };
        setTimeout(chk, 1500);
        go.textContent = 'Готово'; go.disabled = false; go.onclick = close;
      } catch(err){ res.className = 'res no'; res.textContent = err.message || String(err); go.disabled = false; go.textContent = 'Опубликовать'; }
    }; tok.focus(); }); }

function download(){ const out = clone(draft); out.updated = new Date().toISOString().slice(0, 10);
  const a = h('a', { href:URL.createObjectURL(new Blob([JSON.stringify(out, null, 1) + '\n'], { type:'application/json' })), download:'content.json' }); document.body.append(a); a.click(); a.remove(); }

function resetDraft(){ modal((md, close) => { md.append(h('h3', {}, 'Сбросить черновик?'), h('p', {}, 'Все неопубликованные правки пропадут, в форме и превью снова будет опубликованная версия.'),
  h('div', { class:'acts' }, h('button', { class:'btn ghost', type:'button', onclick:close }, 'Отмена'), h('button', { class:'btn pri', type:'button', onclick:() => { const old = draft; draft = clone(published); LS.set('kosmoDraft', draft); for (const k in open) delete open[k]; logAdd('Черновик сброшен'); save(); render(); updNav(); close();
    toast('Черновик сброшен', 'Вернуть', () => { draft = old; save(); render(); updNav(); }, 7000); } }, 'Сбросить'))); }); }

/* ---------- превью: масштаб под высоту колонки */
function fit(){ const w = $('#phWrap'), p = $('#phone'); if (!w) return; const k = Math.min(1, (w.clientHeight - 4) / 868, (w.clientWidth - 4) / 414); p.style.transform = `scale(${k})`; p.style.marginBottom = `${-868 * (1 - k)}px`; }
addEventListener('resize', fit);

/* ---------- старт */
async function boot(){
  let pub = null;
  try { const r = await fetch('../app/content.json?t=' + Date.now(), { cache:'no-store' }); if (r.ok) pub = await r.json(); } catch(_){}
  published = pub || LS.get('kosmoPublished', null) || {};
  if (pub) LS.set('kosmoPublished', pub);
  draft = LS.get('kosmoDraft', null) || clone(published);
  for (const k of Object.keys(published)) if (draft[k] == null) draft[k] = clone(published[k]);
  if (!SEC[cur]) cur = 'dash';
  $('#uName').textContent = user || 'Сотрудник'; $('#uAv').textContent = (user || 'С').split(/\s+/).map(x => x[0]).join('').slice(0, 2).toUpperCase();
  loadEx(); renderNav(); render(); setStatus(); LS.set('kosmoDraft', draft);
  const f = $('#pv'); f.addEventListener('load', () => { pvReady = true; setTimeout(send, 50); }); f.src = '../app/?preview=1'; fit(); }

function enter(){ $('#login').classList.add('hide'); $('#app').classList.remove('hide'); boot(); }
$('#lgForm').addEventListener('submit', e => { e.preventDefault(); const p = $('#lgPass').value, n = $('#lgName').value.trim();
  if (!n){ $('#lgErr').textContent = 'Представьтесь — имя попадёт в журнал изменений'; $('#lgName').focus(); return; }
  if (p !== PASS){ $('#lgErr').textContent = 'Неверный пароль'; $('#lgPass').select(); return; }
  user = n; try { sessionStorage.setItem('kosmoAdmin', n); localStorage.setItem('kosmoAdminName', n); } catch(_){} enter(); });
try { $('#lgName').value = localStorage.getItem('kosmoAdminName') || ''; const s = sessionStorage.getItem('kosmoAdmin'); if (s){ user = s; enter(); } else ($('#lgName').value ? $('#lgPass') : $('#lgName')).focus(); } catch(_){}

$('#bPub').onclick = publish; $('#bDl').onclick = download; $('#bReset').onclick = resetDraft; $('#bLog').onclick = showLog;
$('#bOut').onclick = () => { try { sessionStorage.removeItem('kosmoAdmin'); } catch(_){} location.reload(); };
$('#bReload').onclick = () => { $('#pv').src = '../app/?preview=1&r=' + Date.now(); };
$('#bQr').onclick = e => { e.stopPropagation(); $('#qrPop').classList.toggle('hide'); };
document.addEventListener('click', e => { if (!e.target.closest('#qrPop')) $('#qrPop').classList.add('hide'); });
/* черновик изменили в другой вкладке */
addEventListener('storage', e => { if (e.key === 'kosmoDraft' && e.newValue && draft){ try { draft = JSON.parse(e.newValue); render(); updNav(); setStatus(); } catch(_){} } });
})();
</script>
